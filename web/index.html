<!DOCTYPE HTML>
<html manifest="">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GridTrade Contracts</title>
    <link rel="icon" href="resources/images/favicon.svg" type="image/svg+xml">
    <style>
        #gt-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
            background: #f4f6f8; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; color: #24323d; z-index: 100000; }
        #gt-splash .gt-splash-logo { width: 56px; height: 56px; border-radius: 14px; background: #0f766e; display: flex; align-items: center; justify-content: center; }
        #gt-splash h1 { font-size: 20px; font-weight: 600; margin: 16px 0 4px; }
        #gt-splash h1 span { color: #0f766e; }
        #gt-splash-msg { font-size: 13px; color: #5b6b78; }
        #gt-splash-msg.gt-splash-error { color: #b42318; }
        #gt-splash .gt-bar { width: 180px; height: 3px; margin-top: 16px; background: #dbe3e8; overflow: hidden; border-radius: 2px; }
        #gt-splash .gt-bar i { display: block; width: 40%; height: 100%; background: #0f766e; animation: gtbar 1.1s ease-in-out infinite; }
        @keyframes gtbar { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    </style>
    <!-- The line below must be kept intact for Sencha Cmd to build your application -->
    <script id="microloader" data-app="6f1d2a4c-8e3b-4c5d-9a7e-2b1c0d9e8f71" type="text/javascript" src="bootstrap.js"></script>
</head>
<body>
    <div id="gt-splash">
        <div class="gt-splash-logo"><svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><path d="M8 21l5.5-6.5 4 4 6.5-8.5" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="10" r="2.4" fill="#fbbf24"/></svg></div>
        <h1>GridTrade <span>Contracts</span></h1>
        <div id="gt-splash-msg">Starting...</div>
        <div class="gt-bar"><i></i></div>
    </div>
</body>
</html>
